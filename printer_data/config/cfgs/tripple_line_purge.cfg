[gcode_macro TRIPLE_PURGE_LINE]
description: Triple-pass purge (> < >) with no stationary E; diagonal wipe default ON
gcode:
  {% set bed_x = printer.toolhead.axis_maximum.x|float %}
  {% set bed_y = printer.toolhead.axis_maximum.y|float %}

  # --- Tunables (override via params) ---
  {% set margin_x       = params.MARGIN_X|default(10.0)|float %}   # left/right clearance
  {% set y_front        = params.Y|default(5.0)|float %}           # front Y for first line
  {% set line_spacing   = params.SPACING|default(1.2)|float %}     # gap between lines (mm)
  {% set purge_height   = params.HEIGHT|default(0.30)|float %}     # Z during purge (mm)
  {% set travel_f       = params.TRAVEL_F|default(6000)|float %}   # mm/min travel
  {% set print_f        = params.PRINT_F|default(1200)|float %}    # mm/min line draw
  {% set purge_per_line = params.PER_LINE|default(15.0)|float %}   # mm filament per pass
  {% set retract        = params.RETRACT|default(1.0)|float %}     # mm retract at line end

  # Wipe behavior (defaults to diagonal)
  {% set diag           = params.DIAG|default(1)|int %}            # 1=diagonal (default), 0=straight-X
  {% set wipe_dx_base   = params.WIPE_DX|default(1.0)|float %}
  {% set wipe_dy_base   = params.WIPE_DY|default(0.6)|float %}

  # --- Geometry (auto-scales to bed; explicit clamps to keep moves on-bed) ---
  {% set edge = 2.0 %}
  {% set bed_xm2 = bed_x - edge %}
  {% set bed_ym2 = bed_y - edge %}

  {# start_x = max(margin_x, edge) #}
  {% set start_x = margin_x if margin_x > edge else edge %}

  {# end_x tries to be bed_x - margin_x, but at least 20 mm span, and clamped to bed_x - edge #}
  {% set tentative_end = bed_x - margin_x %}
  {% set min_span = start_x + 20.0 %}
  {% set end_x0 = tentative_end if tentative_end > min_span else min_span %}
  {% set end_x = end_x0 if end_x0 < bed_xm2 else bed_xm2 %}

  {# y rows clamped into [edge, bed_y - edge] #}
  {% set y0_tmp = y_front if y_front > edge else edge %}
  {% set y0 = y0_tmp if y0_tmp < bed_ym2 else bed_ym2 %}
  {% set y1_tmp = y0 + line_spacing %}
  {% set y1 = y1_tmp if y1_tmp < bed_ym2 else bed_ym2 %}
  {% set y2_tmp = y1 + line_spacing %}
  {% set y2 = y2_tmp if y2_tmp < bed_ym2 else bed_ym2 %}

  SAVE_GCODE_STATE NAME=PURGE_STATE
  G90
  M83
  G92 E0

  # ---- Pass 1: Left -> Right ----
  G1 X{start_x} Y{y0} F{travel_f}
  G1 Z{purge_height} F{travel_f}
  G1 X{end_x} Y{y0} E{purge_per_line} F{print_f}
  G1 E-{retract} F1800
  {% set dx = wipe_dx_base if diag else 1.0 %}
  {% set dy = wipe_dy_base if diag else 0.0 %}
  {% set tx0 = end_x + dx %}
  {% set ty0 = y0    + dy %}
  {% set tx1 = tx0 if tx0 > edge else edge %}
  {% set tx = tx1 if tx1 < bed_xm2 else bed_xm2 %}
  {% set ty1 = ty0 if ty0 > edge else edge %}
  {% set ty = ty1 if ty1 < bed_ym2 else bed_ym2 %}
  G1 X{tx} Y{ty} F{travel_f}

  # ---- Pass 2: Right -> Left ----
  G1 X{end_x} Y{y1} F{travel_f}
  G1 Z{purge_height} F{travel_f}
  G1 X{start_x} Y{y1} E{purge_per_line} F{print_f}
  G1 E-{retract} F1800
  {% set dx = -wipe_dx_base if diag else -1.0 %}
  {% set dy =  wipe_dy_base if diag else  0.0 %}
  {% set tx0 = start_x + dx %}
  {% set ty0 = y1      + dy %}
  {% set tx1 = tx0 if tx0 > edge else edge %}
  {% set tx = tx1 if tx1 < bed_xm2 else bed_xm2 %}
  {% set ty1 = ty0 if ty0 > edge else edge %}
  {% set ty = ty1 if ty1 < bed_ym2 else bed_ym2 %}
  G1 X{tx} Y{ty} F{travel_f}

  # ---- Pass 3: Left -> Right ----
  G1 X{start_x} Y{y2} F{travel_f}
  G1 Z{purge_height} F{travel_f}
  G1 X{end_x} Y{y2} E{purge_per_line} F{print_f}
  G1 E-{retract} F1800
  {% set dx = wipe_dx_base if diag else 1.0 %}
  {% set dy = wipe_dy_base if diag else 0.0 %}
  {% set tx0 = end_x + dx %}
  {% set ty0 = y2    + dy %}
  {% set tx1 = tx0 if tx0 > edge else edge %}
  {% set tx = tx1 if tx1 < bed_xm2 else bed_xm2 %}
  {% set ty1 = ty0 if ty0 > edge else edge %}
  {% set ty = ty1 if ty1 < bed_ym2 else bed_ym2 %}
  G1 X{tx} Y{ty} F{travel_f}

  # Clear & normalize
  G1 Z{purge_height + 2.0} F{travel_f}
  G92 E0
  RESTORE_GCODE_STATE NAME=PURGE_STATE

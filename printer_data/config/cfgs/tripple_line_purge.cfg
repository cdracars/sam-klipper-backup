[gcode_macro TRIPLE_PURGE_LINE]
description: Creates a triple-pass purge line at front of bed (> < >)
gcode:
    {% set bed_x = printer.toolhead.axis_maximum.x|float %}
    {% set bed_y = printer.toolhead.axis_maximum.y|float %}
    
    # Configuration
    {% set purge_start_x = 10 %}           # Start X position
    {% set purge_end_x = bed_x - 10 %}     # End X position  
    {% set purge_y = 5 %}                  # Y position (front of bed)
    {% set purge_height = 0.3 %}           # Z height for purging
    {% set purge_speed = 1200 %}           # Print speed (mm/min)
    {% set travel_speed = 6000 %}          # Travel speed (mm/min)
    {% set purge_amount = 15 %}            # Extrusion amount per line
    
    SAVE_GCODE_STATE NAME=PURGE_STATE
    
    G90                                    # Absolute positioning
    M83                                    # Relative extrusion
    G92 E0                                 # Reset extruder
    
    # Move to start position
    G1 X{purge_start_x} Y{purge_y} F{travel_speed}
    G1 Z{purge_height} F{travel_speed}
    
    # First line: Left to Right (>)
    G1 X{purge_end_x} Y{purge_y} E{purge_amount} F{purge_speed}
    
    # Move up slightly for second line
    G1 Y{purge_y + 1} F{travel_speed}
    
    # Second line: Right to Left (<)
    G1 X{purge_start_x} Y{purge_y + 1} E{purge_amount} F{purge_speed}
    
    # Move up slightly for third line  
    G1 Y{purge_y + 2} F{travel_speed}
    
    # Third line: Left to Right (>)
    G1 X{purge_end_x} Y{purge_y + 2} E{purge_amount} F{purge_speed}
    
    # Small retraction and Z-hop
    G1 E-1 F1800                          # Small retraction
    G1 Z{purge_height + 2} F{travel_speed} # Z-hop
    
    G92 E0                                 # Reset extruder position
    
    RESTORE_GCODE_STATE NAME=PURGE_STATE
[gcode_macro TRIPLE_PURGE_LINE]
description: Triple-pass purge (> < >) with no stationary E; optional diagonal wipe at ends
gcode:
  {% set bed_x = printer.toolhead.axis_maximum.x|float %}
  {% set bed_y = printer.toolhead.axis_maximum.y|float %}

  # --- Tunables ---
  {% set margin_x       = params.MARGIN_X|default(10.0)|float %}   # clear left/right edges
  {% set y_front        = params.Y|default(5.0)|float %}           # front Y for first line
  {% set line_spacing   = params.SPACING|default(1.2)|float %}
  {% set purge_height   = params.HEIGHT|default(0.30)|float %}
  {% set travel_f       = params.TRAVEL_F|default(6000)|float %}
  {% set print_f        = params.PRINT_F|default(1200)|float %}
  {% set purge_per_line = params.PER_LINE|default(15.0)|float %}
  {% set retract        = params.RETRACT|default(1.0)|float %}

  # Wipe options
  {% set diag           = params.DIAG|default(1)|int %}            # 0 = straight X wipe, 1 = diagonal wipe (default)
  {% set wipe_dx        = params.WIPE_DX|default(1.0)|float %}     # X component of wipe (mm)
  {% set wipe_dy        = params.WIPE_DY|default(0.6)|float %}     # Y component of wipe (mm) when DIAG=1

  # --- Geometry / clamps (auto-scales to your bed) ---
  {% set start_x = max(margin_x, 2.0) %}
  {% set end_x   = max(start_x + 20.0, bed_x - margin_x) %}
  {% set y0      = min(max(y_front, 2.0), bed_y - 2.0) %}
  {% set y1      = min(y0 + line_spacing, bed_y - 2.0) %}
  {% set y2      = min(y1 + line_spacing, bed_y - 2.0) %}

  SAVE_GCODE_STATE NAME=PURGE_STATE
  G90
  M83
  G92 E0

  # Helper: do a wipe with boundary clamps
  {% macro wipe(x, y, dx, dy) -%}
    {% set tx = max(2.0, min(bed_x - 2.0, x + dx)) %}
    {% set ty = max(2.0, min(bed_y - 2.0, y + dy)) %}
    G1 X{{ tx }} Y{{ ty }} F{{ travel_f }}
  {%- endmacro %}

  # ---- Pass 1: Left -> Right ----
  G1 X{start_x} Y{y0} F{travel_f}
  G1 Z{purge_height} F{travel_f}
  G1 X{end_x}   Y{y0}   E{purge_per_line} F{print_f}
  G1 E-{retract} F1800
  {% if diag %}
    {{ wipe(end_x, y0,  wipe_dx,  wipe_dy) }}
  {% else %}
    {{ wipe(end_x, y0,  1.0,      0.0) }}
  {% endif %}

  # ---- Pass 2: Right -> Left ----
  G1 X{start_x} Y{y1} F{travel_f}
  G1 Z{purge_height} F{travel_f}
  G1 X{end_x}   Y{y1}   E{purge_per_line} F{print_f}
  G1 E-{retract} F1800
  {% if diag %}
    {{ wipe(end_x, y1, -wipe_dx,  wipe_dy) }}
  {% else %}
    {{ wipe(end_x, y1, -1.0,      0.0) }}
  {% endif %}

  # ---- Pass 3: Left -> Right ----
  G1 X{start_x} Y{y2} F{travel_f}
  G1 Z{purge_height} F{travel_f}
  G1 X{end_x}   Y{y2}   E{purge_per_line} F{print_f}
  G1 E-{retract} F1800
  {% if diag %}
    {{ wipe(end_x, y2,  wipe_dx,  wipe_dy) }}
  {% else %}
    {{ wipe(end_x, y2,  1.0,      0.0) }}
  {% endif %}

  # Clear & normalize
  G1 Z{purge_height + 2.0} F{travel_f}
  G92 E0
  RESTORE_GCODE_STATE NAME=PURGE_STATE

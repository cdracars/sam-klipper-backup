    {% if printer.configfile.settings.safe_z_home %}
    G1 X{startX} Y{startY} F{maxVelocityAdjusted}
    {% endif %}


    G1 Z5 F1500


    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bedtempIntermediate}



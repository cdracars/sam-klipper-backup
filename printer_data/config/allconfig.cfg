    M140 S{bedtempSlicer}


    G28 Z
    BED_MESH_CALIBRATE ADAPTIVE=1
    M104 S{hotendtemp}



    G1 X10 Y0 F{maxVelocityAdjusted}
    M109 S{hotendtemp}
    G1 Z20 F3000


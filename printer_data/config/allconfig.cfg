[gcode_macro TRIPLE_PURGE_LINE]  # cfgs/tripple_line_purge.cfg, cfgs/tripple_line_purge.cfg, cfgs/tripple_line_purge.cfg, cfgs/tripple_line_purge.cfg, cfgs/tripple_line_purge.cfg, cfgs/tripple_line_purge.cfg, cfgs/tripple_line_purge.cfg, cfgs/tripple_line_purge.cfg, cfgs/tripple_line_purge.cfg, cfgs/tripple_line_purge.cfg
description: Centered, multi-pass purge line with configurable width for precise filament purging and bed adhesion preparation
gcode:
    {% set bed_x = printer.toolhead.axis_maximum.x|float %}
    {% set bed_y = printer.toolhead.axis_maximum.y|float %}


    {% set purge_width = params.WIDTH|default(200.0)|float %}
    {% set line_width = params.LINE_WIDTH|default(0.4)|float %}
    {% set margin_x = (bed_x - purge_width) / 2.0 %}
    {% set y_front = params.Y|default(5.0)|float %}
    {% set line_spacing = line_width * 1.5 %}
    {% set purge_height = params.HEIGHT|default(0.30)|float %}
    {% set travel_f = params.TRAVEL_F|default(6000)|float %}
    {% set print_f = params.PRINT_F|default(1200)|float %}
    {% set purge_per_line = params.PER_LINE|default(10.0)|float %}
    {% set retract = params.RETRACT|default(1.0)|float %}


    {% set start_x = margin_x %}
    {% set end_x = start_x + purge_width %}


    {% set edge = 2.0 %}
    {% set bed_xm2 = bed_x - edge %}
    {% set bed_ym2 = bed_y - edge %}


    {% set y0 = y_front %}
    {% if y0 < edge %}{% set y0 = edge %}{% endif %}
    {% if y0 > bed_ym2 %}{% set y0 = bed_ym2 %}{% endif %}

    {% set y1 = y0 + line_spacing %}
    {% if y1 > bed_ym2 %}{% set y1 = bed_ym2 %}{% endif %}

    {% set y2 = y1 + line_spacing %}
    {% if y2 > bed_ym2 %}{% set y2 = bed_ym2 %}{% endif %}

    SAVE_GCODE_STATE NAME=PURGE_STATE
    G90
    M83
    G92 E0


    G1 X{start_x} Y{y0} F{travel_f}
    G1 Z{purge_height} F{travel_f}
    G1 X{end_x} Y{y0} E{purge_per_line} F{print_f}
    G1 E-{retract} F1800
    {% set dx = 1.0 %}{% set dy = 0.0 %}
    {% set tx0 = end_x + dx %}{% set ty0 = y0 + dy %}
    {% set tx = tx0 %}{% if tx < edge %}{% set tx = edge %}{% endif %}{% if tx > bed_xm2 %}{% set tx = bed_xm2 %}{% endif %}
    {% set ty = ty0 %}{% if ty < edge %}{% set ty = edge %}{% endif %}{% if ty > bed_ym2 %}{% set ty = bed_ym2 %}{% endif %}
    G1 X{tx} Y{ty} F{travel_f}


    G1 X{end_x} Y{y1} F{travel_f}
    G1 Z{purge_height} F{travel_f}
    G1 X{start_x} Y{y1} E{purge_per_line} F{print_f}
    G1 E-{retract} F1800
    {% set dx = -1.0 %}{% set dy = 0.0 %}
    {% set tx0 = start_x + dx %}{% set ty0 = y1 + dy %}
    {% set tx = tx0 %}{% if tx < edge %}{% set tx = edge %}{% endif %}{% if tx > bed_xm2 %}{% set tx = bed_xm2 %}{% endif %}
    {% set ty = ty0 %}{% if ty < edge %}{% set ty = edge %}{% endif %}{% if ty > bed_ym2 %}{% set ty = bed_ym2 %}{% endif %}
    G1 X{tx} Y{ty} F{travel_f}


    G1 X{start_x} Y{y2} F{travel_f}
    G1 Z{purge_height} F{travel_f}
    G1 X{end_x} Y{y2} E{purge_per_line} F{print_f}
    G1 E-{retract} F1800
    {% set dx = 1.0 %}{% set dy = 0.0 %}
    {% set tx0 = end_x + dx %}{% set ty0 = y2 + dy %}
    {% set tx = tx0 %}{% if tx < edge %}{% set tx = edge %}{% endif %}{% if tx > bed_xm2 %}{% set tx = bed_xm2 %}{% endif %}
    {% set ty = ty0 %}{% if ty < edge %}{% set ty = edge %}{% endif %}{% if ty > bed_ym2 %}{% set ty = bed_ym2 %}{% endif %}
    G1 X{tx} Y{ty} F{travel_f}


    G1 Z{purge_height + 2.0} F{travel_f}
    G92 E0
    RESTORE_GCODE_STATE NAME=PURGE_STATE

